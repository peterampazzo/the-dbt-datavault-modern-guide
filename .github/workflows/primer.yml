name: Primer compile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  primer-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r primer-dbt/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm primer:compile
      - run: git diff --exit-code src/lib/primer/compiled.json
